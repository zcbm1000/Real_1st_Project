<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>드론 소방 관제 시스템</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/nav.css">
  <link rel="stylesheet" href="/static/css/hud.css">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
{% include 'include/nav.html' %}

<main class="auth-page" id="signin-page">
  <div class="auth-card" id="signin-card">
    <h1 class="auth-title">로그인 화면</h1>
    <p class="auth-subtitle">로그인 후 시스템을 이용할 수 있습니다.</p>

    <!-- 인라인 에러 박스 -->
    <div class="auth-error" id="login-error">
      ID 또는 PW가 일치하지않습니다.<br>다시 확인 후 시도해주세요.
    </div>

    <form id="login-form" novalidate>
      <div class="input-group">
        <span class="input-icon">👤</span>
        <input class="form-input" type="text" id="mId" name="mId"
               placeholder="ID를 입력하세요" required autocomplete="username">
      </div>
      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input class="form-input" type="password" id="mPw" name="mPw"
               placeholder="PW를 입력하세요" required autocomplete="current-password">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="login-submit-btn">
          로그인
        </button>
      </div>
    </form>

    <div class="form-links">
      <a href="/member/signup_form" class="form-link" id="goto-signup">회원가입</a>
      <span style="color:var(--border-mid);">|</span>
      <a href="/member/id_find_form" class="form-link" id="goto-find">ID 찾기</a>
      <a href="/member/pw_find_form" class="form-link" id="goto-finds">PW 찾기</a>
    </div>
  </div>
</main>

<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
  // 폼이 제출될시 브러우저가 화면을 새로고침 동작을 막는 함수
  // submit 가 붙어잇는 폼 태그가르킴
  e.preventDefault();
  // html에서 id가 login-error 인 
  // 값을찾아 변수명에 담고 show 라는 이름표를 없애는 작업
  // css에 show 값이 있을경우 로그인 버튼을 누르면 호출후 메세지를 숨김
  // remove(): 지정한 값을 찾아 삭제할때 쓰는 함수
  const errorBox = document.getElementById('login-error');
  errorBox.classList.remove('show');

  // 웹페이지의 입력창에 적힌 모든 내용을 한꺼번에 수집해서 담는 역할
  const formData = new FormData(this);
  try {
    // 해당 member/signin 에 정보를 제출
    const res  = await fetch('/member/signin', { method: 'POST', body: formData });
    // 최종데이터(성공여부, 이동할주소 등등)가 담김
    const data = await res.json();
    
    if (data.success) {
      // 로그인 성공시
      if (data.redirect === "stay") {
        // stay 라는 응답을 받을시 현재 페이지를 새로고침 하는 함수
        location.reload(); 
      } else {
          // 해당 페이지로 이동
        window.location.href = data.redirect;
      }
    } else { // 로그인 실패시
      // 로그인 실패 문구 확인
      // focus() 특정 입력칸을 사용자가 바로 입력할수있게 하는 함수
      errorBox.classList.add('show');
      document.getElementById('mPw').value = '';
      document.getElementById('mPw').focus();
    }

    // 통신자체가 실패했을시 에러 메세지 확인
  } catch(err) {
    errorBox.classList.add('show');
  }
});
</script>
</body>
</html>
